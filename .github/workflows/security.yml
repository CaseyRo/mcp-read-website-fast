name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch: {}

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"

      # Scoped audit of the LOCKED runtime deps (bare `uvx pip-audit` audits its own venv).
      - name: Export locked runtime requirements
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt

      - name: Security audit (pip-audit)
        run: uvx pip-audit==2.9.0 --no-deps --disable-pip -r requirements-audit.txt
