name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # fastmcp 4: fail on any camelCase MCP field access instead of warning.
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.13.5"
      - run: uv sync --locked
      # Scoped audit of the LOCKED runtime deps (what the image ships). A bare
      # `uvx pip-audit` audits its own tool env and always passes.
      - name: Security audit (locked runtime deps)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx pip-audit==2.9.0 --no-deps --disable-pip -r requirements-audit.txt
      - run: uv run ruff check .
      # Offline only: live tests need network + Playwright browsers.
      - run: uv run pytest -m "not live"
