name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'tests/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync

      - name: Test
        run: uv run pytest -x -m "not live"
        env:
          FASTMCP_MCP_CAMELCASE_COMPAT: "false"

      - name: Security audit (pip-audit)
        run: uvx pip-audit

      # Versions are git tags; nothing is committed back to main (it is
      # protected, and a bump commit caused uv.lock drift + a double deploy).
      # Deploy happens off the merge push itself: compose.yaml builds from
      # source (`build: .`), so no registry image is pulled. Do NOT re-add an
      # image build-push or an explicit deploy trigger step.
      - name: Tag next patch
        run: |
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST#v}"
          NEXT="v$MAJOR.$MINOR.$((PATCH + 1))"
          git tag "$NEXT"
          git push origin "$NEXT"
