services:
  mcp-read-website-fast:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      - TRANSPORT=http
      - HOST=0.0.0.0
      - MCP_API_KEY=${MCP_API_KEY}
      - FASTMCP_HOME=/data/fastmcp
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
    volumes:
      - fastmcp-data:/data/fastmcp
    mem_limit: 2g
    memswap_limit: 2g
    cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fastmcp-data:
